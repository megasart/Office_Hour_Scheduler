<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <header>
      <h1>Student Dashboard</h1>
      <p>Find an office-hour appointment.</p>
    </header>

    <main>
      <a class="back-link" href="/">← Back to Home</a>

      <section class="panel">
        <h2>Available Office Hours</h2>

        <div class="card">
          <h3>CS4800 with Dr. Taylor</h3>
          <p>Monday, 3:00 PM - 3:30 PM</p>
          <p>Building 9, Room 201 / Zoom</p>

          <a
            class="button request-button"
            href="#"
            data-office-hour-id="1"
            data-office-hour-title="CS4800 with Dr. Taylor"
            data-office-hour-time="Monday, 3:00 PM - 3:30 PM"
            data-office-hour-location="Building 9, Room 201 / Zoom"
          >
            Request Appointment
          </a>
        </div>

        <div class="card">
          <h3>CS4800 with Dr. Taylor</h3>
          <p>Wednesday, 1:00 PM - 1:30 PM</p>
          <p>Zoom</p>

          <a
            class="button request-button"
            href="#"
            data-office-hour-id="2"
            data-office-hour-title="CS4800 with Dr. Taylor"
            data-office-hour-time="Wednesday, 1:00 PM - 1:30 PM"
            data-office-hour-location="Zoom"
          >
            Request Appointment
          </a>
        </div>
      </section>
    </main>

    <dialog id="appointment-dialog">
      <div class="dialog-content">
        <div class="dialog-header">
          <h2>Request an Appointment</h2>

          <button
            class="dialog-close"
            type="button"
            aria-label="Close appointment form"
          >
            ×
          </button>
        </div>

        <div id="selected-office-hour" class="selected-office-hour">
          <strong id="selected-course-teacher"></strong>
          <span id="selected-time" class="selected-office-detail"></span>
          <span id="selected-location" class="selected-office-detail"></span>
        </div>

        <form id="appointment-form">
          <input type="hidden" id="office-hour-id">

          <label for="assignment">Assignment</label>
          <select id="assignment" required>
            <option value="">Choose an assignment</option>
            <option value="Assignment 1">Assignment 1</option>
            <option value="Assignment 2">Assignment 2</option>
            <option value="Other">Other</option>
          </select>

          <label for="problem">What do you need help with?</label>
          <textarea
            id="problem"
            placeholder="Describe your question or problem..."
            required
          ></textarea>

          <label for="meeting-type">Meeting Type</label>
          <select id="meeting-type" required>
            <option value="">Choose a meeting type</option>
            <option value="In-person">In-person</option>
            <option value="Zoom">Zoom</option>
          </select>

          <button type="submit">Submit Appointment Request</button>
        </form>

        <p id="form-message" aria-live="polite"></p>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
