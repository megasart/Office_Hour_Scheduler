<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Appointment - instoffice</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="student-page">
    <header class="student-header">
      <a href="/" class="student-brand site-brand">
        <img class="site-logo" src="/assets/instoffice-logo.png" alt="" />
        <span>instoffice</span>
      </a>
      <span class="student-header-actions">Secure appointment link</span>
    </header>

    <main class="student-container">
      <section class="student-intro">
        <p class="dashboard-label">Appointment Management</p>
        <h1 id="manage-title">Loading appointment...</h1>
        <p id="manage-message" class="student-message" aria-live="polite"></p>
      </section>

      <section id="appointment-details" class="student-section" hidden>
        <div id="appointment-summary"></div>
        <div id="appointment-participants"></div>
        <div id="manage-actions" class="manage-actions">
          <button id="cancel-appointment" class="decline-button" type="button">
            Cancel Appointment
          </button>
        </div>
      </section>

      <section id="reschedule-section" class="student-section" hidden>
        <h2>Request a Different Time</h2>
        <label for="reschedule-office-hour">Available office hour</label>
        <select id="reschedule-office-hour"></select>
        <label for="reschedule-date">Date</label>
        <input id="reschedule-date" type="date" />
        <button id="submit-reschedule" type="button">
          Request Reschedule
        </button>
      </section>

      <dialog id="cancel-dialog" class="appointment-action-dialog">
        <form id="cancel-form" novalidate>
          <div class="dialog-heading">
            <h2>Cancel Appointment</h2>
            <button
              id="close-cancel-dialog"
              class="close-dialog-button"
              type="button"
            >
              ×
            </button>
          </div>
          <p>Are you sure you want to cancel this appointment?</p>
          <label for="cancel-reason">
            Note <span class="form-help">(optional)</span>
          </label>
          <textarea
            id="cancel-reason"
            maxlength="500"
            placeholder="Add a note for the teacher, if helpful."
          ></textarea>
          <div class="dialog-actions">
            <button id="keep-appointment" class="small-button" type="button">
              Keep Appointment
            </button>
            <button id="submit-cancel" class="decline-button" type="submit">
              Cancel Appointment
            </button>
          </div>
          <p id="cancel-form-message" class="dialog-form-message" role="alert"></p>
        </form>
      </dialog>
    </main>

    <script src="/manage.js"></script>
  </body>
</html>
