<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Dashboard - Office Hour Scheduler</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="dashboard-page">
    <header class="dashboard-header">
      <a href="/" class="dashboard-brand">Office Hour Scheduler</a>
      <button id="logout-button" class="logout-button" type="button">
        Log Out
      </button>
    </header>

    <main class="dashboard-container">
      <section class="dashboard-intro">
        <p class="dashboard-label">Teacher Dashboard</p>
        <h1 id="teacher-welcome">Welcome</h1>
        <p>Manage availability, impromptu meetings, and student requests.</p>
        <button id="open-office-hour-dialog" type="button">
          Create Office Hour
        </button>
      </section>

      <section class="dashboard-card">
        <div class="section-heading">
          <h2>Office Hours</h2>
          <button id="refresh-office-hours" class="small-button" type="button">
            Refresh
          </button>
        </div>
        <div id="office-hour-list">
          <p>Loading office hours...</p>
        </div>
      </section>

      <section class="dashboard-card">
        <div class="section-heading">
          <h2>Appointment Requests</h2>
          <select id="appointment-filter" class="small-select">
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Declined">Declined</option>
            <option value="Cancelled">Cancelled</option>
            <option value="All">All</option>
          </select>
        </div>
        <p id="teacher-message" class="dashboard-message"></p>
        <div id="appointment-list">
          <p>Loading appointments...</p>
        </div>
      </section>

      <section class="dashboard-card">
        <h2>Approved Meeting Calendar</h2>
        <div id="teacher-calendar">
          <p>Loading approved meetings...</p>
        </div>
      </section>
    </main>

    <dialog id="office-hour-dialog" class="office-hour-dialog">
      <form id="office-hour-form">
        <div class="dialog-heading">
          <h2 id="office-hour-dialog-title">Create Office Hour</h2>
          <button
            id="close-office-hour-dialog"
            class="close-dialog-button"
            type="button"
          >
            ×
          </button>
        </div>

        <input id="office-hour-id" type="hidden" />

        <label for="course-name">Course Name</label>
        <input id="course-name" type="text" maxlength="120" placeholder="CS4800" required />

        <label for="schedule-type">Schedule Type</label>
        <select id="schedule-type" required>
          <option value="recurring">Weekly recurring</option>
          <option value="one-time">One-time / impromptu</option>
        </select>

        <label for="day-of-week" id="day-label">Day</label>
        <select id="day-of-week" required>
          <option value="">Select a day</option>
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Friday">Friday</option>
        </select>

        <label for="specific-date" id="date-label" hidden>Date</label>
        <input id="specific-date" type="date" hidden />

        <label for="start-time">Start Time</label>
        <input id="start-time" type="time" required />

        <label for="end-time">End Time</label>
        <input id="end-time" type="time" required />

        <label for="location">Location</label>
        <input
          id="location"
          type="text"
          maxlength="200"
          placeholder="Building 9, Room 201 or Zoom"
          required
        />

        <label for="meeting-link">Meeting Link (optional)</label>
        <input
          id="meeting-link"
          type="url"
          placeholder="https://zoom.us/..."
        />

        <label for="meeting-mode">Meeting Mode</label>
        <select id="meeting-mode" required>
          <option value="">Select a meeting mode</option>
          <option value="In-person">In-person</option>
          <option value="Zoom">Zoom</option>
          <option value="Both">In-person and Zoom</option>
        </select>

        <label for="capacity">Maximum Participants</label>
        <input id="capacity" type="number" min="1" max="100" value="1" required />

        <label for="time-zone">Time Zone</label>
        <select id="time-zone" required>
          <option value="America/Los_Angeles">Pacific Time</option>
          <option value="America/Denver">Mountain Time</option>
          <option value="America/Chicago">Central Time</option>
          <option value="America/New_York">Eastern Time</option>
          <option value="UTC">UTC</option>
        </select>

        <button type="submit">Save Office Hour</button>
        <p id="office-hour-form-message"></p>
      </form>
    </dialog>

    <script src="teacher.js"></script>
  </body>
</html>
