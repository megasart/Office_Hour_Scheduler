<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <h1>Teacher Dashboard</h1>
      <p>Manage office hours and student requests.</p>
    </header>

    <main>
      <a class="back-link" href="/">← Back to Home</a>

      <section class="panel">
        <h2>Manage Office Hours</h2>
        <p>Add times when students can request meetings.</p>
        <button>Add New Office-Hour Time</button>
      </section>

      <section class="panel">
        <h2>Appointment Requests</h2>

        <div class="card">
          <h3>Alex Student - Assignment 2</h3>
          <p>
            <strong>Question:</strong>
            I need help understanding how to deploy my application.
          </p>
          <p><strong>Requested meeting type:</strong> Zoom</p>
          <button>Approve</button>
          <button>Decline</button>
        </div>
      </section>
    </main>
  </body>
</html>
