<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <header>
      <h1>Teacher Dashboard</h1>
      <p>Manage office hours and student requests.</p>
    </header>

    <main>
      <a class="back-link" href="/">← Back to Home</a>

      <section class="panel">
        <h2>Manage Office Hours</h2>
        <p>
          Adding new office-hour times will be added in a future version.
        </p>
      </section>

      <section class="panel">
        <h2>Pending Appointment Requests</h2>

        <p id="teacher-message" aria-live="polite"></p>

        <div id="appointment-list">
          <p>Loading appointment requests...</p>
        </div>
      </section>
    </main>

    <script src="teacher.js"></script>
  </body>
</html>
