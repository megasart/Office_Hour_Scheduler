<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Profile - instoffice</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="teacher-profile-page">
    <header class="profile-header">
      <a href="/" class="profile-brand site-brand">
        <img class="site-logo" src="/assets/instoffice-logo.png" alt="" />
        <span>instoffice</span>
      </a>

      <a href="/login.html" class="profile-login-link">
        Teacher Login
      </a>
    </header>

    <main class="profile-container">
      <a href="/" class="back-link">← Back to Home</a>

      <section class="profile-intro">
        <p class="dashboard-label">Teacher Calendar</p>
        <h1 id="teacher-name">Loading...</h1>
        <p id="teacher-summary">
          View this teacher's availability and request an appointment.
        </p>
        <p id="teacher-code" class="entry-help"></p>
      </section>

      <section class="profile-section">
        <h2>Availability Calendar</h2>
        <p class="calendar-help">
          Select an available time to continue to the appointment request form.
        </p>
        <p id="profile-message" class="student-message"></p>
        <div
          id="profile-calendar"
          class="availability-calendar"
          aria-label="Teacher office-hour availability"
        ></div>
      </section>

      <section class="profile-section">
        <h2>About This Teacher</h2>
        <div id="profile-office-hours" class="teacher-info-grid">
          <p>Loading teacher information...</p>
        </div>
      </section>
    </main>

    <script src="/teacher-profile.js"></script>
  </body>
</html>
